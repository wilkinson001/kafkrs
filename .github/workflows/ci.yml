name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets

  proto-lint:
    name: Proto lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # buf breaking needs history
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs origin/master)
        if: github.event_name == 'pull_request'
        # actions/checkout populates refs/remotes/origin/master but not
        # refs/heads/master on a PR checkout, so reference the remote-tracking
        # ref directly rather than buf's branch= shorthand.
        run: buf breaking --against ".git#ref=refs/remotes/origin/master"

  python-test:
    name: Python e2e
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: kafkrs-python/pyproject.toml
      - name: Build broker binary
        run: cargo build --bin kafkrs-server
      - name: Install Python package + dev deps
        working-directory: kafkrs-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        working-directory: kafkrs-python
        run: pytest -v

  fresh-install-smoke:
    name: Fresh-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build broker binary
        run: cargo build --release --bin kafkrs-server
      - name: Boot broker against fresh data_dir and poll /health
        run: |
          set -euo pipefail
          # Guarantee fresh install — the regression this guards against was
          # resolve_identity failing when data_dir did not exist yet.
          rm -rf ./smoke_data
          # Launch broker in background, capturing logs for diagnosis on
          # failure. RUST_LOG=info surfaces the identity-resolution / listen
          # lines so we can tell why a boot failed.
          RUST_LOG=info ./target/release/kafkrs-server .github/smoke.toml \
            > smoke_broker.log 2>&1 &
          BROKER_PID=$!
          trap 'kill $BROKER_PID 2>/dev/null || true; rm -rf ./smoke_data' EXIT
          # Poll /health for up to 30 seconds.
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9465/health > /dev/null; then
              echo "Broker responded to /health on attempt $attempt"
              # Confirm the specific regression class this test guards against:
              # data_dir must have been auto-created, and broker_id must have
              # been persisted.
              if [ ! -d ./smoke_data ]; then
                echo "FAIL: data_dir was not auto-created"
                cat smoke_broker.log
                exit 1
              fi
              if [ ! -f ./smoke_data/broker_id ]; then
                echo "FAIL: broker_id file was not persisted"
                cat smoke_broker.log
                exit 1
              fi
              exit 0
            fi
            sleep 0.5
          done
          echo "FAIL: broker did not respond to /health within 30 seconds"
          echo "===== broker log ====="
          cat smoke_broker.log
          exit 1
