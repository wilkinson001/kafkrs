name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets

  proto-lint:
    name: Proto lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # buf breaking needs history
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs origin/master)
        if: github.event_name == 'pull_request'
        # actions/checkout populates refs/remotes/origin/master but not
        # refs/heads/master on a PR checkout, so reference the remote-tracking
        # ref directly rather than buf's branch= shorthand.
        run: buf breaking --against ".git#ref=refs/remotes/origin/master"

  python-test:
    name: Python e2e
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: kafkrs-python/pyproject.toml
      - name: Build broker binary
        run: cargo build --bin kafkrs-server
      - name: Install Python package + dev deps
        working-directory: kafkrs-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        working-directory: kafkrs-python
        run: pytest -v
