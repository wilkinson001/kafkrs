version: v2
modules:
  - path: kafkrs-models/proto
lint:
  use:
    - STANDARD
  except:
    # Allow our envelope ErrorResponse to coexist with the same name pattern at v1.
    - PACKAGE_DIRECTORY_MATCH
    # Kafka protocol uses ERR_* naming convention for error codes, not ERROR_CODE_* prefix.
    - ENUM_VALUE_PREFIX
breaking:
  use:
    - FILE
  except:
    # Field numbers are deliberately reserved for future RPCs (see the
    # `reserved` comments in v1.proto) and moved out of the reserved range
    # when we implement them — e.g. DeleteTopic taking 50/51 from the
    # admin-RPC reservation. Buf treats that as a breaking change, but it
    # is precisely the intended workflow.
    - RESERVED_MESSAGE_NO_DELETE
    - RESERVED_ENUM_NO_DELETE
