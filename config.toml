address = "127.0.0.1"
data_dir = "./data"

[ports]
wire = [5432]
# Uncomment to enable the admin HTTP endpoint on this port.
# Serves `/metrics` (Prometheus scrape), `/health` (liveness, always 200),
# and `/ready` (readiness, 503 until wire listeners are up).
# metrics = 9464

[broker]
disk_type = "nvme"
auto_create_topics = false
default_partition_count = 1

[object_store]
backend = "filesystem"
bucket = "kafkrs-data"
prefix = ""
endpoint = ""
region = "us-east-1"
