address = "127.0.0.1"
data_dir = "./data"

[ports]
wire = [5432]
# Uncomment to enable Prometheus metrics scrape endpoint:
# metrics = 9464

[broker]
disk_type = "nvme"
auto_create_topics = false
default_partition_count = 1

[object_store]
backend = "filesystem"
bucket = "kafkrs-data"
prefix = ""
endpoint = ""
region = "us-east-1"
