address = "127.0.0.1"
data_dir = "./data"

[ports]
wire = [5432]
# Optional admin HTTP endpoints — each is independently opt-in.
# If both are set to the same port value, one listener serves the merged routes.
# metrics = 9464   # Prometheus scrape endpoint (GET /metrics)
# health  = 9465   # Liveness + readiness (GET /health, GET /ready)

[broker]
disk_type = "nvme"
auto_create_topics = false
default_partition_count = 1

[object_store]
backend = "filesystem"
bucket = "kafkrs-data"
prefix = ""
endpoint = ""
region = "us-east-1"
