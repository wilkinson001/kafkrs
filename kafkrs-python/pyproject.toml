[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kafkrs"
version = "0.3.1"
description = "Pure-Python async client for the kafkrs broker."
requires-python = ">=3.8"
dependencies = [
  "protobuf>=7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["kafkrs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
